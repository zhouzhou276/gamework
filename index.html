<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>炼金店铺 - 完全版</title>
  <style>
    * { box-sizing: border-box; user-select: none; }
    html, body { margin: 0; padding: 0; width: 1920px; height: 1080px; overflow: hidden; background: #2c2a24; font-family: "Microsoft YaHei", "Segoe UI", sans-serif; }
    .page { position: absolute; top: 0; left: 0; width: 1920px; height: 1080px; background: #2c2a24; overflow-y: auto; padding: 20px 40px; }
    .hidden-page { display: none; }
    #startScreen { display: flex; flex-direction: column; justify-content: center; align-items: center; }
    .start-card { width: 600px; text-align: center; background: linear-gradient(145deg, #fdf8ed, #f5e6c4); border-radius: 64px; padding: 50px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
    .start-card h1 { font-size: 64px; color: #7a3e00; margin: 0; }
    .start-card p { font-size: 24px; color: #b97f3a; }
    #gameMainPage { display: none; }
    .game-container { display: flex; flex-direction: column; gap: 30px; max-width: 1200px; margin: 0 auto; height: 100%; justify-content: center; }
    .queue-box { background: #fffaf0; border-radius: 48px; padding: 20px; text-align: center; box-shadow: 0 8px 20px rgba(0,0,0,0.2); width: 100%; }
    .queue-title { font-size: 28px; font-weight: bold; margin-bottom: 15px; color: #7a3e00; }
    .queue-list { display: flex; flex-direction: row; flex-wrap: wrap; gap: 15px; justify-content: center; max-height: 240px; overflow-y: auto; padding: 10px; }
    .queue-item { background: #fef2e0; border-radius: 32px; padding: 12px 20px; display: flex; align-items: center; gap: 15px; cursor: pointer; transition: 0.1s; border: 1px solid #ffcd94; width: 280px; flex-shrink: 0; }
    .queue-item:hover { background: #ffefdb; transform: scale(1.02); }
    .queue-emoji { font-size: 48px; }
    .queue-info { flex: 1; text-align: left; }
    .queue-name { font-weight: bold; font-size: 20px; }
    .queue-order { font-size: 14px; color: #b45f1b; }
    .game-box { background: white; border-radius: 48px; padding: 30px; text-align: center; width: 100%; }
    .top-bar { display: flex; justify-content: space-between; margin-bottom: 15px; background: #fff0d4; border-radius: 60px; padding: 8px 20px; flex-wrap: wrap; gap: 10px; }
    .gold, .day, .shop-level, .morality { font-size: 18px; font-weight: bold; color: #d48806; }
    .inventory { background: #fff7e6; border-radius: 32px; padding: 15px; margin: 20px 0; text-align: left; max-height: 200px; overflow-y: auto; }
    .inventory p { margin: 5px 0; font-size: 16px; }
    button { background: #ff9f43; border: none; border-radius: 60px; padding: 8px 20px; font-size: 16px; font-weight: bold; color: white; cursor: pointer; transition: 0.1s; box-shadow: 0 3px 0 #b45f1b; margin: 4px; }
    button:active { transform: translateY(2px); box-shadow: 0 1px 0 #b45f1b; }
    button.secondary { background: #7f8c8d; box-shadow: 0 3px 0 #5d6d6e; }
    .grid-container, .recipe-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; margin-top: 30px; }
    .adventurer-card, .recipe-card { background: #fff5e6; border-radius: 40px; padding: 20px; text-align: center; cursor: pointer; transition: 0.1s; border: 2px solid #ffcd94; }
    .adventurer-card:hover { transform: scale(1.02); background: #ffefdb; }
    .recipe-card.locked { opacity: 0.7; filter: grayscale(0.2); background: #d9cfb5; cursor: default; }
    .adventurer-emoji { font-size: 70px; }
    .adventurer-name, .recipe-name { font-size: 28px; font-weight: bold; margin: 10px 0; }
    .level-badge { background: #d48806; color: white; display: inline-block; padding: 4px 16px; border-radius: 40px; font-size: 18px; }
    .report-container { max-width: 800px; margin: 40px auto; background: #fffaf0; border-radius: 64px; padding: 40px; }
    .detail-row { font-size: 22px; margin: 20px 0; border-bottom: 1px solid #eeddbb; padding-bottom: 10px; }
    .exp-bar { background: #e0cfb0; border-radius: 30px; height: 24px; width: 100%; overflow: hidden; margin: 10px 0; }
    .exp-fill { background: #ff9f43; width: 0%; height: 100%; border-radius: 30px; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 2000; }
    .modal-content { background: #fffaf0; width: 600px; max-width: 90%; border-radius: 48px; padding: 30px; text-align: center; border: 3px solid #ffc107; max-height: 80vh; overflow-y: auto; }
    .settings-row { display: flex; justify-content: space-between; align-items: center; margin: 10px 0; flex-wrap: wrap; }
    select, input { padding: 8px; border-radius: 20px; border: 1px solid #ccc; font-size: 16px; }
    .morality-warning { color: #c0392b; font-weight: bold; }
  </style>
</head>
<body>

<!-- 开始界面 -->
<div id="startScreen" class="page">
  <div class="start-card">
    <h1 id="shopTitle">🏰 炼金店铺</h1>
    <p>—— 冒险者的小镇驿站 ——</p>
    <button id="startBtn" style="font-size: 28px; padding: 16px 40px; margin-top: 30px;">🧪 开始营业</button>
  </div>
</div>

<!-- 游戏主界面 -->
<div id="gameMainPage" class="page">
  <div class="game-container">
    <div class="queue-box">
      <div class="queue-title">👥 今日访客</div>
      <div id="queueList" class="queue-list"><div style="text-align:center; color:gray;">等待新的一天...</div></div>
    </div>
    <div class="game-box">
      <div class="top-bar">
        <span class="day">📅 第 <span id="dayCount">1</span> 天</span>
        <span class="shop-level">🏪 店铺 Lv.<span id="shopLevel">1</span></span>
        <span class="gold">💰 金币：<span id="gold">100</span></span>
        <span class="morality">⚖️ 良心值：<span id="moralityValue">50</span></span>
      </div>
      <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px;">
        <button id="openShopBtn">📦 进货成品药水</button>
        <button id="openAlchemyBtn">⚗️ 炼金台</button>
        <button id="openBestiaryBtn">📖 冒险者图鉴</button>
        <button id="openRecipeBookBtn">📚 配方书</button>
        <button id="upgradeShopBtn" style="background:#2c6e9e;">🏆 店铺升级</button>
        <button id="endDayBtn" style="background:#8e44ad;">📅 结束今日</button>
        <button id="moralityChoiceBtn" style="background:#a55d35;">⚖️ 抉择时刻</button>
        <button id="settingsBtn" style="background:#6c5b7b;">⚙️ 设置</button>
      </div>
      <div class="inventory" id="inventoryContainer"><h3>🎒 库存</h3><p>暂无药水</p></div>
      <div class="message" id="message"></div>
    </div>
  </div>
</div>

<!-- 其他页面 -->
<div id="bestiaryPage" class="page hidden-page"><div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;"><h1 style="color: #ffebc2; font-size: 48px;">📖 冒险者图鉴</h1><button id="backToGameFromBestiary" class="secondary">🏠 返回店铺</button></div><div id="adventurerGrid" class="grid-container"></div></div>
<div id="reportPage" class="page hidden-page"><div style="max-width: 900px; margin: 0 auto;"><button id="backToBestiary" class="secondary" style="margin-bottom: 20px;">← 返回图鉴</button><div id="reportContent" class="report-container"></div></div></div>
<div id="recipeBookPage" class="page hidden-page"><div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;"><h1 style="color: #ffebc2; font-size: 48px;">📚 配方书</h1><button id="backToGameFromRecipe" class="secondary">🏠 返回店铺</button></div><div id="recipeGrid" class="recipe-grid"></div></div>

<!-- 弹窗 -->
<div id="settlementModal" class="modal"><div class="modal-content"><h2>📊 每日结算</h2><div id="settlementDetails"></div><button id="confirmSettlementBtn">新的一天</button></div></div>
<div id="upgradeModal" class="modal"><div class="modal-content"><h2>🏆 店铺升级</h2><div id="upgradeInfo"></div><button id="doUpgradeBtn">消耗金币升级</button><button id="closeUpgradeModal" class="secondary">取消</button></div></div>
<div id="eventModal" class="modal"><div class="modal-content"><h2>✨ 突发事件</h2><div id="eventDescription"></div><div id="eventOptions" class="event-buttons"></div></div></div>
<div id="moralityModal" class="modal"><div class="modal-content"><h2>⚖️ 良心抉择</h2><div id="moralityDescription"></div><div id="moralityOptions" class="event-buttons"></div></div></div>
<div id="settingsModal" class="modal"><div class="modal-content"><h2>⚙️ 游戏设置</h2><div class="settings-section"><h3>🏪 店铺</h3><div class="settings-row"><label>店铺名称：</label><input type="text" id="shopNameInput" maxlength="20"></div></div><div class="settings-section"><h3>💾 存档/读档</h3><div class="settings-row"><button id="saveGameBtn">保存游戏</button><button id="loadGameBtn">读取存档</button></div></div><div class="settings-section"><h3>🔊 声音</h3><div class="settings-row"><label>静音模式：</label><input type="checkbox" id="muteCheckbox"></div></div><div class="settings-section"><h3>🖥️ 界面</h3><div class="settings-row"><label>消息显示时长(秒)：</label><input type="range" id="msgDuration" min="1" max="5" step="0.5" value="2"><span id="msgDurationValue">2</span></div></div><div class="settings-section"><h3>📁 文件</h3><div class="settings-row"><button id="exportSaveBtn">导出存档</button><label class="file-input-label">导入存档<input type="file" id="importFile" accept=".json"></label></div></div><button id="closeSettingsBtn" class="secondary">关闭</button></div></div>
<div id="shopModal" class="modal"><div class="modal-content"><h2>🏪 进货成品药水</h2><div id="shopItemsList"></div><button id="closeShopBtn" class="secondary">关闭</button></div></div>
<div id="alchemyModal" class="modal"><div class="modal-content"><h2>🔬 炼金台研制</h2><div style="background:#efe2c9; padding:15px; border-radius:28px; margin:15px 0;">🌿 草药：<span id="herbCount">0</span> 份 &nbsp;|&nbsp; ✨ 稀有花：<span id="rareFlowerCount">0</span> 朵</div><div class="settings-row"><label>选择配方：</label><select id="recipeSelect" style="width:70%;"></select></div><div id="recipeMaterialsDisplay" style="margin:10px 0;"></div><button id="craftSelectedBtn">🧪 炼制所选药水</button><button id="closeModalBtn" class="secondary">关闭</button></div></div>

<script>
// ======================= 游戏数据 =======================
let gold = 100;
let day = 1;
let dailyIncome = 0, dailyExpense = 0;
const dailyRent = 20;
let shopLevel = 1;
function getUpgradeCost() { return [200,500,1000,1500][shopLevel-1] || 1500; }
let craftCount = { total: 0 };
let morality = 50;
let deliveryBonus = 1.0;
let isEventActive = false;
let mute = false;
let msgDuration = 2;
let messageTimeout = null;

let potionInventory = {
  "小红药水": 0, "大生命药水": 0, "魔力药水": 0, "勇气药水": 0, "禁忌药剂": 0,
  "高级恢复药剂": 0, "高品质毒药": 0, "实验型药剂": 0, "醒酒药": 0, "幸运药水": 0,
  "小型生命药水": 0, "廉价止血剂": 0
};
let herb = 5, rareFlower = 2;

const adventurersData = [
  { id: 0, name: "老鼠矿工", emoji: "🐭⛏️", profession: "矿工", skill: "即便只剩1点血也不愿撤退", level: 1, exp: 0, expToNext: 100, status: "健康", traits: "节俭，固执，不服输", favoritePotion: "小型生命药水，勇气药水，廉价止血剂", commonEnding: "“他认为那只是普通塌方。”" },
  { id: 1, name: "青蛙吟游诗人", emoji: "🐸🎶", profession: "吟游诗人", skill: "会主动帮玩家宣传店铺，偶尔带来额外客人", level: 1, exp: 10, expToNext: 100, status: "健康", traits: "乐观，话很多，不靠谱", favoritePotion: "醒酒药，幸运药水", commonEnding: "“他坚持认为那条龙喜欢音乐。”" },
  { id: 2, name: "仓鼠炼金学徒", emoji: "🐹🧪", profession: "炼金学徒", skill: "会偷偷模仿玩家炼药，有概率复制配方", level: 1, exp: 5, expToNext: 100, status: "健康", traits: "好奇，冒失，崇拜炼金术", favoritePotion: "实验型药剂", commonEnding: "“至少这次爆炸比上次更亮。”" },
  { id: 3, name: "狐狸赏金猎人", emoji: "🦊🗡️", profession: "赏金猎人", skill: "只信任高品质药剂，低品质药会降低好感", level: 2, exp: 30, expToNext: 100, status: "健康", traits: "冷静，现实，多疑", favoritePotion: "高品质毒药", commonEnding: "“她低估了悬赏单上的轻微危险。”" },
  { id: 4, name: "野猪圣骑士", emoji: "🐗🛡️", profession: "圣骑士", skill: "会替队友承担伤害，受伤概率高于普通角色", level: 2, exp: 20, expToNext: 100, status: "轻伤", traits: "正义感强，固执，不怕死", favoritePotion: "高级恢复药剂", commonEnding: "“最后倒下的人，通常是他。”" },
  { id: 5, name: "黑猫诅咒术士", emoji: "🐈⬛🔮", profession: "诅咒术士", skill: "会主动传播诅咒，可能解锁禁忌炼金路线", level: 3, exp: 80, expToNext: 120, status: "诅咒", traits: "神秘，危险，喜怒无常", favoritePotion: "禁忌药剂", commonEnding: "“她终于听见了深渊的回应。”" }
];
let adventurers = JSON.parse(JSON.stringify(adventurersData));
let currentAdventurerId = null;
let queue = [];

let recipes = [
  { id: 0, name: "小红药水", materials: "🌿 草药 x1", effect: "恢复 20 HP", unlocked: true, price: 10 },
  { id: 1, name: "大生命药水", materials: "🌿 草药 x2 + ✨ 稀有花 x1", effect: "恢复 50 HP", unlocked: true, price: 25 },
  { id: 2, name: "魔力药水", materials: "✨ 稀有花 x3", effect: "恢复 30 MP", unlocked: false, lockCondition: "店铺等级 ≥ 2", price: 30 },
  { id: 3, name: "勇气药水", materials: "🌿 草药 x1 + ✨ 稀有花 x2", effect: "解除胆小鬼诅咒", unlocked: false, lockCondition: "炼制次数 ≥ 5", price: 20 },
  { id: 4, name: "禁忌药剂", materials: "🌿 草药 x2 + ✨ 稀有花 x2", effect: "未知效果", unlocked: false, lockCondition: "黑猫诅咒术士出现后", price: 50 },
  { id: 5, name: "高级恢复药剂", materials: "🌿 草药 x3 + ✨ 稀有花 x2", effect: "恢复 100 HP", unlocked: false, lockCondition: "店铺等级 ≥ 3", price: 40 },
  { id: 6, name: "高品质毒药", materials: "🌿 草药 x1 + ✨ 稀有花 x1", effect: "造成伤害", unlocked: false, lockCondition: "狐狸赏金猎人出现后", price: 35 },
  { id: 7, name: "实验型药剂", materials: "🌿 草药 x2", effect: "随机效果", unlocked: true, price: 15 },
  { id: 8, name: "醒酒药", materials: "🌿 草药 x1", effect: "解除醉酒", unlocked: true, price: 12 },
  { id: 9, name: "幸运药水", materials: "✨ 稀有花 x2", effect: "临时增加掉落率", unlocked: false, lockCondition: "青蛙吟游诗人出现后", price: 28 },
  { id: 10, name: "小型生命药水", materials: "🌿 草药 x1", effect: "恢复 15 HP", unlocked: true, price: 8 },
  { id: 11, name: "廉价止血剂", materials: "🌿 草药 x1", effect: "恢复 10 HP", unlocked: true, price: 5 }
];

function updateRecipesUnlock() {
  recipes[2].unlocked = (shopLevel >= 2);
  recipes[3].unlocked = (craftCount.total >= 5);
  recipes[4].unlocked = (shopLevel >= 2 && adventurers.some(a=>a.name==="黑猫诅咒术士"));
  recipes[5].unlocked = (shopLevel >= 3);
  recipes[6].unlocked = (shopLevel >= 2 && adventurers.some(a=>a.name==="狐狸赏金猎人"));
  recipes[9].unlocked = (shopLevel >= 2 && adventurers.some(a=>a.name==="青蛙吟游诗人"));
}

function showMessage(msg, isError = false) {
  const msgDiv = document.getElementById("message");
  if (msgDiv) {
    if (messageTimeout) clearTimeout(messageTimeout);
    msgDiv.innerText = msg;
    msgDiv.style.color = isError ? "#c0392b" : "#2f855a";
    messageTimeout = setTimeout(() => msgDiv.style.color = "#2f855a", msgDuration * 1000);
  }
}
function updateUI() {
  document.getElementById("gold").innerText = gold;
  document.getElementById("dayCount").innerText = day;
  document.getElementById("shopLevel").innerText = shopLevel;
  document.getElementById("moralityValue").innerText = morality;
  updateInventoryDisplay();
}
function updateInventoryDisplay() {
  const container = document.getElementById("inventoryContainer");
  if (!container) return;
  let html = "<h3>🎒 库存</h3>";
  for (let [name, count] of Object.entries(potionInventory)) {
    if (count > 0) html += `<p>${name}：${count} 瓶</p>`;
  }
  if (html === "<h3>🎒 库存</h3>") html += "<p>暂无药水</p>";
  container.innerHTML = html;
}
function addIncome(amount) { dailyIncome += amount; gold += amount; }
function addExpense(amount) { dailyExpense += amount; gold -= amount; }
function changeMorality(delta) {
  morality = Math.min(100, Math.max(0, morality + delta));
  updateUI();
  if (morality <= 20) showMessage("⚠️ 你的良心值过低，冒险者开始不信任你！", true);
  if (morality >= 80) showMessage("✨ 你的善行感动了小镇，大家更加信任你。", false);
}

function generateDailyQueue() {
  const maxQueue = Math.min(3 + Math.floor(shopLevel / 2), 6);
  const availableIds = adventurersData.map(a => a.id);
  const newQueue = [];
  for (let i = 0; i < maxQueue; i++) {
    const randomId = availableIds[Math.floor(Math.random() * availableIds.length)];
    const unlockedPotions = recipes.filter(r => r.unlocked).map(r => r.name);
    if (unlockedPotions.length === 0) unlockedPotions.push("小红药水");
    const potionName = unlockedPotions[Math.floor(Math.random() * unlockedPotions.length)];
    const quantity = Math.floor(Math.random() * 3) + 1;
    const basePrice = recipes.find(r => r.name === potionName)?.price || 10;
    const reward = basePrice * quantity + Math.floor(Math.random() * 10) + 5;
    newQueue.push({ adventurerId: randomId, order: { potionName, quantity, reward } });
  }
  queue = newQueue;
  renderQueue();
}
function renderQueue() {
  const container = document.getElementById("queueList");
  if (!container) return;
  if (queue.length === 0) { container.innerHTML = "<div style='text-align:center; color:gray;'>暂无访客</div>"; return; }
  container.innerHTML = "";
  queue.forEach((item, idx) => {
    const adv = adventurersData.find(a => a.id === item.adventurerId);
    const card = document.createElement("div");
    card.className = "queue-item";
    card.innerHTML = `<div class="queue-emoji">${adv.emoji}</div><div class="queue-info"><div class="queue-name">${adv.name}</div><div class="queue-order">📦 需要：${item.order.potionName} x${item.order.quantity} | 💰 ${item.order.reward}金币</div></div>`;
    card.addEventListener("click", () => openDeliveryModal(idx));
    container.appendChild(card);
  });
}
function openDeliveryModal(queueIndex) {
  const item = queue[queueIndex];
  const adv = adventurersData.find(a => a.id === item.adventurerId);
  const needPotion = item.order.potionName;
  const needQty = item.order.quantity;
  const reward = item.order.reward;
  const currentStock = potionInventory[needPotion] || 0;
  if (currentStock >= needQty) {
    // 交付成功
    potionInventory[needPotion] -= needQty;
    gold += reward;
    addIncome(reward);
    const advLive = adventurers.find(a => a.id === item.adventurerId);
    if (advLive) advLive.exp += 10;
    showMessage(`✅ 交付 ${needPotion} x${needQty} 给 ${adv.name}，获得 ${reward} 金币！`, false);
    queue.splice(queueIndex, 1);
    renderQueue();
    updateUI();
    tryTriggerEvent("delivery");
  } else {
    // ========== 无法交付的惩罚 ==========
    showMessage(`❌ 库存不足！${adv.name} 愤怒地离开了，良心值-5。`, true);
    changeMorality(-5);           // 良心值降低
    queue.splice(queueIndex, 1);  // 冒险者离开
    renderQueue();
    updateUI();
    // 额外惩罚：减少一定金币作为赔偿？可选，但不做过度惩罚
  }
}

function endDay() {
  let rent = dailyRent;
  if (gold >= rent) { gold -= rent; addExpense(rent); showMessage(`🏠 扣除每日租金 ${rent} 金币`, false); }
  else { gold -= rent; addExpense(rent); showMessage(`⚠️ 金币不足支付租金！负债 ${-gold} 金币`, true); }
  const profit = dailyIncome - dailyExpense;
  document.getElementById("settlementDetails").innerHTML = `今日收入：+${dailyIncome} 金币<br>今日支出：-${dailyExpense} 金币<br>店铺租金：-${rent} 金币<br><strong>今日利润：${profit >= 0 ? '+' : ''}${profit} 金币</strong><br>当前金币：${gold} 金币`;
  document.getElementById("settlementModal").style.display = "flex";
}
function confirmSettlement() {
  document.getElementById("settlementModal").style.display = "none";
  day++;
  dailyIncome = 0; dailyExpense = 0;
  deliveryBonus = 1.0;
  adventurers.forEach(adv => {
    adv.exp = Math.min(adv.exp + 5, adv.expToNext * 2);
    if (Math.random() < 0.2) {
      const states = ["健康", "轻伤", "中毒", "诅咒"];
      adv.status = states[Math.floor(Math.random() * states.length)];
    }
  });
  updateRecipesUnlock();
  generateDailyQueue();
  updateUI();
  showMessage(`🌞 第 ${day} 天开始了！新客人已出现。`, false);
  tryTriggerEvent("daily");
}

    evil: { text: "高价卖给他（15金币，良心-10）", effect: () => { if(potionInventory["小红药水"]>=1){ potionInventory["小红药水"]--; gold+=15; addIncome(15); changeMorality(-10); showMessage("你赚了15金币，良心-10。"); } else showMessage("没有药水",true); } }

function showRandomMoralityEvent() {
  const event = moralityEvents[Math.floor(Math.random() * moralityEvents.length)];
  document.getElementById("moralityDescription").innerHTML = `<strong>${event.title}</strong><br><br>${event.desc}`;
  const optionsDiv = document.getElementById("moralityOptions");
  optionsDiv.innerHTML = "";
  const goodBtn = document.createElement("button");
  goodBtn.textContent = event.good.text;
  goodBtn.style.background = "#2e7d32";
  goodBtn.onclick = () => {
    event.good.effect();
    document.getElementById("moralityModal").style.display = "none";
    updateUI();
  };
  const evilBtn = document.createElement("button");
  evilBtn.textContent = event.evil.text;
  evilBtn.style.background = "#8b0000";
  evilBtn.onclick = () => {
    event.evil.effect();
    document.getElementById("moralityModal").style.display = "none";
    updateUI();
  };
  optionsDiv.appendChild(goodBtn);
  optionsDiv.appendChild(evilBtn);
  document.getElementById("moralityModal").style.display = "flex";
}

function tryTriggerEvent(trigger) { if (Math.random() < 0.2 && !isEventActive) { /* 保留空实现 */ } }

// 其他原有函数（升级、商店、炼金台、图鉴等，保持不变）
function openUpgradeModal() {
  const cost = getUpgradeCost();
  document.getElementById("upgradeInfo").innerHTML = `当前等级：Lv.${shopLevel}<br>下一级：Lv.${shopLevel+1}<br>升级所需金币：${cost}<br>升级效果：新配方、更多客人`;
  document.getElementById("upgradeModal").style.display = "flex";
}
function doUpgrade() {
  const cost = getUpgradeCost();
  if (gold >= cost) { gold -= cost; shopLevel++; addExpense(cost); updateUI(); updateRecipesUnlock(); showMessage(`🏆 店铺升级到 Lv.${shopLevel}！`, false); document.getElementById("upgradeModal").style.display = "none"; generateDailyQueue(); }
  else alert(`金币不足！需要 ${cost} 金币。`);
}
function closeUpgradeModal() { document.getElementById("upgradeModal").style.display = "none"; }

function openShop() {
  const shopDiv = document.getElementById("shopItemsList");
  shopDiv.innerHTML = "";
  recipes.forEach(recipe => {
    if (recipe.unlocked) {
      const price = recipe.price;
      const div = document.createElement("div");
      div.className = "settings-row";
      div.innerHTML = `<span>${recipe.name} - ${price}金币</span><button class="buyPotionBtn" data-name="${recipe.name}" data-price="${price}">购买</button>`;
      shopDiv.appendChild(div);
    }
  });
  document.getElementById("shopModal").style.display = "flex";
  document.querySelectorAll(".buyPotionBtn").forEach(btn => {
    btn.addEventListener("click", (e) => {
      const name = btn.getAttribute("data-name");
      const price = parseInt(btn.getAttribute("data-price"));
      if (gold >= price) {
        gold -= price;
        addExpense(price);
        potionInventory[name] = (potionInventory[name] || 0) + 1;
        updateUI();
        showMessage(`购买了 ${name}！`);
      } else showMessage("金币不足！", true);
    });
  });
}
function closeShop() { document.getElementById("shopModal").style.display = "none"; }

let currentSelectedRecipeId = 0;
function updateRecipeSelect() {
  const select = document.getElementById("recipeSelect");
  if (!select) return;
  select.innerHTML = "";
  recipes.forEach(recipe => {
    if (recipe.unlocked) {
      const option = document.createElement("option");
      option.value = recipe.id;
      option.textContent = recipe.name;
      select.appendChild(option);
    }
  });
  if (select.options.length) currentSelectedRecipeId = parseInt(select.value);
  showRecipeMaterials();
}
function showRecipeMaterials() {
  const recipe = recipes.find(r => r.id === currentSelectedRecipeId);
  if (recipe) document.getElementById("recipeMaterialsDisplay").innerHTML = `📦 所需材料：${recipe.materials}<br>✨ 效果：${recipe.effect}`;
}
function openModal() {
  updateRecipeSelect();
  document.getElementById("herbCount").innerText = herb;
  document.getElementById("rareFlowerCount").innerText = rareFlower;
  document.getElementById("alchemyModal").style.display = "flex";
}
function closeModal() { document.getElementById("alchemyModal").style.display = "none"; }
function craftSelected() {
  const select = document.getElementById("recipeSelect");
  if (!select) return;
  const recipeId = parseInt(select.value);
  const recipe = recipes.find(r => r.id === recipeId);
  if (!recipe) return;
  let needHerb = 0, needFlower = 0;
  if (recipe.materials.includes("草药 x1")) needHerb = 1;
  if (recipe.materials.includes("草药 x2")) needHerb = 2;
  if (recipe.materials.includes("草药 x3")) needHerb = 3;
  if (recipe.materials.includes("稀有花 x1")) needFlower = 1;
  if (recipe.materials.includes("稀有花 x2")) needFlower = 2;
  if (recipe.materials.includes("稀有花 x3")) needFlower = 3;
  if (herb >= needHerb && rareFlower >= needFlower) {
    herb -= needHerb;
    rareFlower -= needFlower;
    potionInventory[recipe.name] = (potionInventory[recipe.name] || 0) + 1;
    craftCount.total++;
    updateRecipesUnlock();
    updateUI();
    showMessage(`✅ 成功炼制了 ${recipe.name}！`);
    closeModal();
  } else alert(`材料不足！需要 ${needHerb} 草药, ${needFlower} 稀有花`);
}

function renderBestiary() {
  const grid = document.getElementById("adventurerGrid");
  if (!grid) return;
  grid.innerHTML = "";
  adventurers.forEach(adv => {
    const card = document.createElement("div");
    card.className = "adventurer-card";
    card.innerHTML = `<div class="adventurer-emoji">${adv.emoji}</div><div class="adventurer-name">${adv.name}</div><div class="level-badge">Lv.${adv.level}</div><div style="margin-top:12px;color:${adv.status==='健康'?'green':'red'}">${adv.status}</div>`;
    card.addEventListener("click", () => { currentAdventurerId = adv.id; showReportPage(); });
    grid.appendChild(card);
  });
}
function showReportPage() {
  const adv = adventurers.find(a => a.id === currentAdventurerId);
  if (!adv) return;
  const expPercent = (adv.exp / adv.expToNext) * 100;
  document.getElementById("reportContent").innerHTML = `<div style="text-align:center;"><div style="font-size:90px;">${adv.emoji}</div><div style="font-size:44px;">${adv.name}</div><div class="detail-row">职业：${adv.profession}</div><div class="detail-row">特殊机制：${adv.skill}</div><div class="detail-row">性格：${adv.traits}</div><div class="detail-row">偏好药水：${adv.favoritePotion}</div><div class="detail-row">常见结局：${adv.commonEnding}</div><div class="detail-row">等级 Lv.${adv.level}</div><div class="detail-row">状态：${adv.status}</div><div class="detail-row">经验 ${adv.exp}/${adv.expToNext}<div class="exp-bar"><div class="exp-fill" style="width:${expPercent}%;"></div></div></div><button id="upgradeAdvBtn" class="upgrade-btn">消耗100经验升级</button></div>`;
  const btn = document.getElementById("upgradeAdvBtn");
  if (btn) btn.addEventListener("click", () => { if(adv.exp>=100){ adv.exp-=100; adv.level++; adv.expToNext=Math.floor(adv.expToNext*1.2); showReportPage(); renderBestiary(); } else alert("经验不足"); });
  document.getElementById("bestiaryPage").classList.add("hidden-page");
  document.getElementById("reportPage").classList.remove("hidden-page");
}
function backToBestiary() {
  document.getElementById("reportPage").classList.add("hidden-page");
  document.getElementById("bestiaryPage").classList.remove("hidden-page");
}

function renderRecipeBook() {
  const container = document.getElementById("recipeGrid");
  if (!container) return;
  container.innerHTML = "";
  recipes.forEach(recipe => {
    const card = document.createElement("div");
    card.className = `recipe-card ${recipe.unlocked ? "" : "locked"}`;
    card.innerHTML = `<div class="recipe-name">${recipe.name}</div><div class="recipe-materials">📦 ${recipe.materials}</div><div class="recipe-effect">✨ 效果：${recipe.effect}</div>${!recipe.unlocked ? `<div>🔒 ${recipe.lockCondition}</div>` : '<div style="color:green;">✅ 已解锁</div>'}`;
    if (recipe.unlocked) {
      card.style.cursor = "pointer";
      card.addEventListener("click", () => {
        openModal();
        setTimeout(() => {
          const select = document.getElementById("recipeSelect");
          if (select) { select.value = recipe.id; select.dispatchEvent(new Event("change")); }
        }, 50);
      });
    }
    container.appendChild(card);
  });
}

function saveGame() {
  const save = { gold, day, shopLevel, morality, herb, rareFlower, potionInventory, adventurers, queue, craftCount, recipes };
  localStorage.setItem("alchemySave", JSON.stringify(save));
  showMessage("游戏已保存");
}
function loadGame() {
  const raw = localStorage.getItem("alchemySave");
  if (!raw) { showMessage("无存档", true); return; }
  const data = JSON.parse(raw);
  gold = data.gold; day = data.day; shopLevel = data.shopLevel; morality = data.morality; herb = data.herb; rareFlower = data.rareFlower;
  potionInventory = data.potionInventory; adventurers = data.adventurers; queue = data.queue; craftCount = data.craftCount; recipes = data.recipes;
  updateUI(); updateRecipesUnlock(); renderQueue(); renderBestiary(); renderRecipeBook();
  showMessage("读取存档成功");
}
function exportSave() {
  const save = { gold, day, shopLevel, morality, herb, rareFlower, potionInventory, adventurers, queue, craftCount, recipes };
  const blob = new Blob([JSON.stringify(save)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `炼金店铺_存档_${new Date().toISOString().slice(0,19)}.json`;
  a.click();
}
function importSave(file) {
  const reader = new FileReader();
  reader.onload = e => {
    const data = JSON.parse(e.target.result);
    gold = data.gold; day = data.day; shopLevel = data.shopLevel; morality = data.morality; herb = data.herb; rareFlower = data.rareFlower;
    potionInventory = data.potionInventory; adventurers = data.adventurers; queue = data.queue; craftCount = data.craftCount; recipes = data.recipes;
    updateUI(); updateRecipesUnlock(); renderQueue(); renderBestiary(); renderRecipeBook();
    showMessage("导入成功");
  };
  reader.readAsText(file);
}
function setShopName() {
  const newName = document.getElementById("shopNameInput").value.trim();
  if (newName) document.title = `炼金店铺 - ${newName}`;
}
function openSettings() { document.getElementById("settingsModal").style.display = "flex"; }
function closeSettings() { document.getElementById("settingsModal").style.display = "none"; }

function startGame() {
  document.getElementById("startScreen").style.display = "none";
  document.getElementById("gameMainPage").style.display = "block";
  generateDailyQueue();
  updateUI();
  showMessage("🧹 帘子掀开，欢迎光临！");
}
function openBestiary() { renderBestiary(); document.getElementById("gameMainPage").style.display = "none"; document.getElementById("bestiaryPage").classList.remove("hidden-page"); }
function backToGameFromBestiary() { document.getElementById("bestiaryPage").classList.add("hidden-page"); document.getElementById("gameMainPage").style.display = "block"; }
function openRecipeBook() { renderRecipeBook(); document.getElementById("gameMainPage").style.display = "none"; document.getElementById("recipeBookPage").classList.remove("hidden-page"); }
function backToGameFromRecipe() { document.getElementById("recipeBookPage").classList.add("hidden-page"); document.getElementById("gameMainPage").style.display = "block"; }

// 绑定事件
document.getElementById("startBtn").addEventListener("click", startGame);
document.getElementById("openBestiaryBtn").addEventListener("click", openBestiary);
document.getElementById("backToGameFromBestiary").addEventListener("click", backToGameFromBestiary);
document.getElementById("backToBestiary").addEventListener("click", backToBestiary);
document.getElementById("openRecipeBookBtn").addEventListener("click", openRecipeBook);
document.getElementById("backToGameFromRecipe").addEventListener("click", backToGameFromRecipe);
document.getElementById("endDayBtn").addEventListener("click", endDay);
document.getElementById("upgradeShopBtn").addEventListener("click", openUpgradeModal);
document.getElementById("confirmSettlementBtn").addEventListener("click", confirmSettlement);
document.getElementById("doUpgradeBtn").addEventListener("click", doUpgrade);
document.getElementById("closeUpgradeModal").addEventListener("click", closeUpgradeModal);
document.getElementById("openAlchemyBtn").addEventListener("click", openModal);
document.getElementById("closeModalBtn").addEventListener("click", closeModal);
document.getElementById("craftSelectedBtn").addEventListener("click", craftSelected);
document.getElementById("openShopBtn").addEventListener("click", openShop);
document.getElementById("closeShopBtn").addEventListener("click", closeShop);
document.getElementById("settingsBtn").addEventListener("click", openSettings);
document.getElementById("closeSettingsBtn").addEventListener("click", closeSettings);
document.getElementById("saveGameBtn").addEventListener("click", saveGame);
document.getElementById("loadGameBtn").addEventListener("click", loadGame);
document.getElementById("exportSaveBtn").addEventListener("click", exportSave);
document.getElementById("importFile").addEventListener("change", e => { if(e.target.files.length) importSave(e.target.files[0]); e.target.value=""; });
document.getElementById("shopNameInput").addEventListener("change", setShopName);
document.getElementById("muteCheckbox").addEventListener("change", e => mute = e.target.checked);
document.getElementById("msgDuration").addEventListener("input", e => { msgDuration = parseFloat(e.target.value); document.getElementById("msgDurationValue").innerText = msgDuration; });
document.getElementById("recipeSelect")?.addEventListener("change", e => { currentSelectedRecipeId = parseInt(e.target.value); showRecipeMaterials(); });
document.getElementById("moralityChoiceBtn").addEventListener("click", showRandomMoralityEvent);

document.getElementById("startScreen").style.display = "flex";
document.getElementById("gameMainPage").style.display = "none";
updateUI();
renderBestiary();
renderRecipeBook();
updateRecipesUnlock();
</script>
